[pytest]
testpaths = tests
# OneDrive blocks pytest's cache-directory rename on Windows; the cache is not needed.
addopts = -q -p no:cacheprovider
# CrewAI's internal deprecation notices (not our code); LangChain's memory warnings stay visible.
filterwarnings =
    ignore::DeprecationWarning:crewai.*
    ignore::PendingDeprecationWarning:crewai.*
